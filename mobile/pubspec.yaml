name: crop_guard
description: "CropGuard AI — Intelligent Pest Detection & Crop Protection Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: 0.20.3

  # State Management
  provider: ^6.1.2

  # Camera & Media
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # Database & Authentication
  supabase_flutter: ^2.5.6

  # Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
